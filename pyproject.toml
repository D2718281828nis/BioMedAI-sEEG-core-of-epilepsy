[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seeg-extreme-event-agent"
version = "0.1.0"
description = "Auditable agentic extreme-event discovery in multichannel time series"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.10"]

[project.scripts]
seeg-event-agent = "extreme_event_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
